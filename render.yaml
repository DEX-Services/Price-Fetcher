# Render Blueprint for the Price-Fetcher (Option A: native Go build, Background Worker).
#
# When you connect this repo to Render as a "Blueprint", Render reads this file
# and provisions everything automatically: the service, build/start commands,
# health check, instance type, and environment variables — no manual dashboard
# config required.
#
# Deploy:
#   1. Push this repo to GitHub/GitLab/Bitbucket (secrets stay OUT of the repo,
#      see .gitignore; this file references them as env vars).
#   2. In Render: New > Blueprint, pick the repo, hit Apply.
#   3. On first apply, Render asks for the secret values below (REDIS_SERVICE_URI
#      etc.) because they have no default. It stores them as encrypted env vars.
#   4. For any later secret rotation, use `./scripts/render-sync.sh` or the
#      dashboard Environment section.
#
# This is a long-running daemon (holds a WebSocket to Binance + TLS to Redis),
# so it is a Background Worker, NOT a web service.

services:
  # Human-readable name shown in the Render dashboard.
  - type: worker
    name: price-fetcher

    # Directory containing this blueprint, relative to the repo root.
    # If Price-Fetcher IS the repo root, keep this as "" and the build/runtime
    # paths pointing into the repo. Adjust if the folder is nested.
    rootDir: .

    # Runtime: local Go toolchain build (Option A). No Dockerfile needed.
    runtime: go

    # Build the binary without CGO so it runs clean on Render's linux base.
    buildCommand: CGO_ENABLED=0 go build -o price-fetcher ./cmd/fetcher

    # -timeout: connected to Binance, so the WS connection makes it look "long running".
    # Binance's @ticker pushes roughly ~1/sec per asset, so latest prices stay fresh.
    startCommand: ./price-fetcher

    # Keep this instance running 24/7: a streaming worker must never auto-sleep.
    # Change to "free" only if you accept pauses (the WS + Redis connection
    # would drop and reconnect on wake, and prices go stale while paused).
    plan: starter

    # Bring up at least one and don't scale to zero.
    numInstances: 1

    # === Health check ===
    # Render probes this endpoint; 200 = healthy, 503 = feed stale (no fresh
    # price in <30s). Render uses the result to restart a stalled instance.
    healthCheckPath: /healthz

    # === Access ===
    # A Background Worker has no public URL by design; it only talks outbound
    # (to Binance and Redis). No autoDeploy branch restriction:
    autoDeploy: true
    branch: main

    # Pull env from an .env in the repo dir if present (local convenience only;
    # does NOT contain secrets — .env is gitignored). Secret-critical variables
    # below are declared as required env vars Render prompts for.
    envVars:
      # Required — the Aiven Redis TLS URI. Set as a Secret on first deploy.
      - key: REDIS_SERVICE_URI
        sync: false
        value: rediss://MY-PLACEHOLDER
      # Optional; sensible defaults in code. Declared so they are visible/overridable.
      - key: ASSETS
        value: BTC,ETH,SOL,BNB
      - key: PRICE_QUOTE
        value: USDT
      - key: PRICE_KEY_PREFIX
        value: price
      - key: PRICE_STALE_TTL
        value: "30"
      - key: PRICE_HEALTH_ADDR
        value: ":8083"

    # === Logs ===
    # The fetcher uses log/slog to stdout; Render captures it automatically.
    # No extra config needed.