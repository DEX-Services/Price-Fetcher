# Render Blueprint for the Price-Fetcher (Docker runtime).
#
# When you connect this repo to Render as a "Blueprint", Render reads this file
# and provisions everything automatically: the service, Docker build, health
# check, instance type, and environment variables — no manual dashboard config.
#
# WHY DOCKER (and not runtime: go):
#   Render's native Go builder runs `go build -o app` on the whole module from
#   the repo root. This project's main package lives in ./cmd/fetcher, and the
#   root has no .go files, so that build fails with
#   "no Go files in /opt/render/project/go/src/github.com/DEX-Services/...".
#   A Dockerfile lets us build exactly ./cmd/fetcher and pin a Go version.
#
# Deploy:
#   1. Push this repo to GitHub/GitLab/Bitbucket. Secrets stay OUT of the repo
#      (.env is gitignored); this file references them as env vars, and Render
#      prompts for REDIS_SERVICE_URI on first apply.
#   2. In Render: New > Blueprint, pick the repo, Apply.
#   3. Rotate secrets later with ./scripts/render-cli.sh env-sync (Render CLI).

services:
  - type: worker
    name: price-fetcher

    # Repo root for this blueprint. The repo IS the Price-Fetcher project.
    rootDir: .

    # Docker runtime -> builds the Dockerfile in rootDir and runs its CMD.
    runtime: docker

    # Keep this streaming daemon always on: it must hold the WebSocket to
    # Binance and the TLS connection to Redis 24/7. A "free" instance auto-sleeps
    # and would drop both, leaving prices stale.
    plan: starter
    numInstances: 1

    # Render probes this and restarts the worker when the feed is stale
    # (the fetcher returns 200 while fresh, 503 after ~30s with no update).
    healthCheckPath: /healthz

    autoDeploy: true
    branch: main

    # === Environment ===
    # REDIS_SERVICE_* required. On first Blueprint apply Render prompts for the
    # value because it has no secret-default here (never commit the real URI).
    envVars:
      # ASSETS = crypto only (streamed from Binance's WebSocket).
      - key: REDIS_SERVICE_URI
        sync: false
        value: rediss://MY-PLACEHOLDER
      - key: ASSETS
        value: BTC,ETH,SOL,BNB
      - key: PRICE_QUOTE
        value: USDT
      - key: PRICE_KEY_PREFIX
        value: price
      - key: PRICE_STALE_TTL
        value: "30"
      - key: PRICE_HEALTH_ADDR
        value: ":8083"
      # Live-Rates.com supplies all NON-crypto instruments (FX majors, metals,
      # energy, US stocks). The key is a secret: sync:false makes Render prompt
      # for it on first apply instead of storing anything here.
      - key: LIVERATES_API_KEY
        sync: false
      # Case-sensitive: must match the provider catalog exactly.
      - key: LIVERATES_INSTRUMENTS
        value: EURUSD,GBPUSD,AUDUSD,GOLD,SILVER,CrudeOIL,AAPL.us,TSLA.us,NVDA.us
      - key: LIVERATES_POLL_INTERVAL
        value: "2"

    # === Logs ===
    # The fetcher uses log/slog to stdout; Render captures it automatically.
    # No extra config needed.